# ZannenDongle33_uf2 board-specific Kconfig fragment
# (merged after prj.conf, so it overrides prj.conf for this board only)

# This board has an external 32.768 kHz crystal on P0.00/XL1, P0.01/XL2.
# Use it instead of the synthesized LF clock set globally in prj.conf.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_SYNTH=n
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=y

# The 32 MHz crystal (X2) needs no configuration: the nRF52833 radio always
# runs from the HFXO, which is started automatically on clock request.
