# ZannenDongle_uf2 board-specific Kconfig fragment (applied on top of defconfig)

CONFIG_USB_DEVICE_MANUFACTURER="Zannen"
CONFIG_USB_DEVICE_PRODUCT="SlimeNRF Receiver ZannenDongle"

# RGB LED color mode
CONFIG_LED_RGB_COLOR=y

# This board has an external (passive) 32.768 kHz crystal; use it instead of
# the synthesized LF clock set globally in prj.conf. The 32 MHz crystal needs
# no configuration: the radio always runs from the HFXO.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_SYNTH=n
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=y
